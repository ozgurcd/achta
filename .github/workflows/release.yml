name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  GO_VERSION: '1.27.1'
  GORELEASER_VERSION: 'v2.17.0'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Validate tag and source version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "$tag")" = tag
          test "$(git rev-parse "${tag}^{}")" = "$(git rev-parse HEAD)"
          test "$(go run ./cmd/achta version --json | jq -r .version)" = "$tag"
      - name: Install pinned verification tools
        run: make install-tools
      - name: Verify
        run: make verify
      - name: Select version release notes
        run: go run ./cmd/release-notes RELEASE_NOTES.md "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Validate release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish --release-notes=${{ runner.temp }}/release-notes.md

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify Homebrew tap credential
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/ozgurcd/homebrew-tap --jq '.permissions.push')" = true
      - name: Select version release notes
        run: go run ./cmd/release-notes RELEASE_NOTES.md "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish private GitHub release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SOURCE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cask_path="dist/homebrew/Casks/achta.rb"
          test -s "$cask_path"
          desired_version="${GITHUB_REF_NAME#v}"
          grep -Fq "version \"$desired_version\"" "$cask_path"
          release_json="$RUNNER_TEMP/release.json"
          GH_TOKEN="$SOURCE_GITHUB_TOKEN" gh api \
            "repos/ozgurcd/achta/releases/tags/$GITHUB_REF_NAME" > "$release_json"
          rewritten_cask="$RUNNER_TEMP/achta-rewritten.rb"
          go run ./cmd/homebrew-cask "$release_json" "$cask_path" > "$rewritten_cask"
          mv "$rewritten_cask" "$cask_path"
          for asset in \
            achta_Darwin_arm64.tar.gz \
            achta_Darwin_x86_64.tar.gz \
            achta_Linux_arm64.tar.gz \
            achta_Linux_x86_64.tar.gz; do
            expected_hash="$(awk -v name="$asset" '$2 == name { print $1 }' dist/checksums.txt)"
            test -n "$expected_hash"
            test "$(grep -Fc "sha256 \"$expected_hash\"" "$cask_path")" = 1
          done
          test "$(grep -Fc 'https://api.github.com/repos/ozgurcd/achta/releases/assets/' "$cask_path")" = 4
          if grep -Fq 'https://github.com/ozgurcd/achta/releases/download/' "$cask_path"; then
            echo "rewritten Homebrew cask retains a private release browser URL" >&2
            exit 1
          fi
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          gh auth setup-git
          gh repo clone ozgurcd/homebrew-tap "$tap_dir"
          existing="$tap_dir/Casks/achta.rb"
          if [[ -f "$existing" ]]; then
            published_version="$(sed -n 's/^  version "\([^"]*\)"/\1/p' "$existing")"
            if [[ -z "$published_version" ]]; then
              echo "existing Homebrew cask has no parseable version" >&2
              exit 1
            fi
            if [[ "$published_version" != "$desired_version" ]]; then
              newest="$(printf '%s\n' "$desired_version" "$published_version" | sort -V | tail -n 1)"
              if [[ "$newest" == "$published_version" ]]; then
                echo "refusing to downgrade Homebrew from $published_version to $desired_version" >&2
                exit 1
              fi
            fi
          fi
          mkdir -p "$tap_dir/Casks"
          cp "$cask_path" "$existing"
          git -C "$tap_dir" add Casks/achta.rb
          if ! git -C "$tap_dir" diff --cached --quiet; then
            git -C "$tap_dir" config user.name github-actions
            git -C "$tap_dir" config user.email github-actions@github.com
            git -C "$tap_dir" commit -m "chore: update achta cask to $desired_version"
            git -C "$tap_dir" push origin HEAD:main
          else
            echo "Homebrew cask already matches"
          fi
          remote_path="$RUNNER_TEMP/achta.rb"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            repos/ozgurcd/homebrew-tap/contents/Casks/achta.rb > "$remote_path"
          cmp "$cask_path" "$remote_path"
