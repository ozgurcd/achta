name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  GO_VERSION: '1.27.2'
  GORELEASER_VERSION: 'v2.17.0'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Validate tag and source version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "$tag")" = tag
          test "$(git rev-parse "${tag}^{}")" = "$(git rev-parse HEAD)"
          test "$(go run ./cmd/achta version --json | jq -r .version)" = "$tag"
      - name: Install staticcheck (brew-identical build, and prove its version)
        # OWNER RULE (2026-08-27): CI workflows always pin the LATEST
        # stable tool version — pinned (never rolling @latest, which
        # re-scopes silently) and bumped deliberately the moment a new
        # stable ships. v0.8.1 == staticcheck 2026.2.1, latest stable.
        # THE-UNWATCHED-FOUR: the install derives from the workflow-env
        # declaration and the printed version is asserted — staticcheck
        # prints its module version in parentheses, e.g.
        # "staticcheck 2026.2.1 (0.8.1)".
        # OSS-SEC-MFA-FIXES item 12 (owner, 2026-10-09): `go install`ed,
        # v0.8.1 carries golang.org/x/tools v0.44.1-0.20260420230617, which
        # cannot read go1.27.2's export data ("export data version 5 is
        # greater than maximum supported version 4"). CI builds what brew
        # builds: the 2026.2.1 source tarball plus the two dominikh/go-tools
        # PR 1834 patches (x/tools v0.51.0), each checked against its
        # sha256 before use. Drop the patches at the first upstream release
        # that supports Go 1.27.x.
        env:
          STATICCHECK_VERSION: "v0.8.1"
          STATICCHECK_TAG: "2026.2.1"
          STATICCHECK_SOURCE_SHA256: 8d807cd909f4481d6777f7707e5ae75dcc399e14d68ff14a3c814731826e0dfc
          STATICCHECK_PATCH1: 4ff8b865d12b49f3af67daf2294023336987dad5
          STATICCHECK_PATCH1_SHA256: 19f123d3f405f779e82a739d3d6e7e3b289659b496ac82bd699586465b06ecc4
          STATICCHECK_PATCH2: 01bcfe17fb93153091b35df4036a1d73087817ab
          STATICCHECK_PATCH2_SHA256: 52ce80f83d597020938bb7c463070f3c133802995029faeb632e3fc385fb4d8a
        run: |
          src="$RUNNER_TEMP/staticcheck-src"
          mkdir -p "$src"
          curl -fsSL -o "$src/src.tar.gz" "https://github.com/dominikh/go-tools/archive/refs/tags/${STATICCHECK_TAG}.tar.gz"
          curl -fsSL -o "$src/p1.patch" "https://github.com/dominikh/go-tools/commit/${STATICCHECK_PATCH1}.patch?full_index=1"
          curl -fsSL -o "$src/p2.patch" "https://github.com/dominikh/go-tools/commit/${STATICCHECK_PATCH2}.patch?full_index=1"
          printf '%s  %s\n' "$STATICCHECK_SOURCE_SHA256" "$src/src.tar.gz" "$STATICCHECK_PATCH1_SHA256" "$src/p1.patch" "$STATICCHECK_PATCH2_SHA256" "$src/p2.patch" | sha256sum -c -
          tar -xzf "$src/src.tar.gz" -C "$src"
          patch -d "$src/go-tools-${STATICCHECK_TAG}" -p1 < "$src/p1.patch"
          patch -d "$src/go-tools-${STATICCHECK_TAG}" -p1 < "$src/p2.patch"
          (cd "$src/go-tools-${STATICCHECK_TAG}" && go build -trimpath -o "$(go env GOPATH)/bin/staticcheck" ./cmd/staticcheck)
          staticcheck --version
          staticcheck --version | grep -F "staticcheck ${STATICCHECK_TAG} (${STATICCHECK_VERSION#v})"

      - name: Install pinned verification tools
        run: make install-tools
      - name: Verify
        run: make verify
      - name: Check pinned release configuration
        run: make release-check
      - name: Select version release notes
        run: make release-notes-check RELEASE_NOTES_OUTPUT="$RUNNER_TEMP/release-notes.md"
      - name: Validate release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish --release-notes=${{ runner.temp }}/release-notes.md

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify Homebrew tap credential
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/ozgurcd/homebrew-tap --jq '.permissions.push')" = true
      - name: Select version release notes
        run: make release-notes-check RELEASE_NOTES_OUTPUT="$RUNNER_TEMP/release-notes.md"
      - name: Publish public GitHub release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cask_path="dist/homebrew/Casks/achta.rb"
          test -s "$cask_path"
          desired_version="${GITHUB_REF_NAME#v}"
          grep -Fq "version \"$desired_version\"" "$cask_path"
          rewritten_cask="$RUNNER_TEMP/achta-rewritten.rb"
          go run ./cmd/homebrew-cask "$cask_path" > "$rewritten_cask"
          mv "$rewritten_cask" "$cask_path"
          for asset in \
            achta_Darwin_arm64.tar.gz \
            achta_Darwin_x86_64.tar.gz \
            achta_Linux_arm64.tar.gz \
            achta_Linux_x86_64.tar.gz; do
            expected_hash="$(awk -v name="$asset" '$2 == name { print $1 }' dist/checksums.txt)"
            test -n "$expected_hash"
            test "$(grep -Fc "sha256 \"$expected_hash\"" "$cask_path")" = 1
            test "$(grep -Fc "https://github.com/ozgurcd/achta/releases/download/v#{version}/$asset" "$cask_path")" = 1
          done
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          gh auth setup-git
          gh repo clone ozgurcd/homebrew-tap "$tap_dir"
          existing="$tap_dir/Casks/achta.rb"
          if [[ -f "$existing" ]]; then
            published_version="$(sed -n 's/^  version "\([^"]*\)"/\1/p' "$existing")"
            if [[ -z "$published_version" ]]; then
              echo "existing Homebrew cask has no parseable version" >&2
              exit 1
            fi
            if [[ "$published_version" != "$desired_version" ]]; then
              newest="$(printf '%s\n' "$desired_version" "$published_version" | sort -V | tail -n 1)"
              if [[ "$newest" == "$published_version" ]]; then
                echo "refusing to downgrade Homebrew from $published_version to $desired_version" >&2
                exit 1
              fi
            fi
          fi
          mkdir -p "$tap_dir/Casks"
          cp "$cask_path" "$existing"
          git -C "$tap_dir" add Casks/achta.rb
          if ! git -C "$tap_dir" diff --cached --quiet; then
            git -C "$tap_dir" config user.name github-actions
            git -C "$tap_dir" config user.email github-actions@github.com
            git -C "$tap_dir" commit -m "chore: update achta cask to $desired_version"
            git -C "$tap_dir" push origin HEAD:main
          else
            echo "Homebrew cask already matches"
          fi
          remote_path="$RUNNER_TEMP/achta.rb"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            repos/ozgurcd/homebrew-tap/contents/Casks/achta.rb > "$remote_path"
          cmp "$cask_path" "$remote_path"
